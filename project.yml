name: LoveRun
options:
  bundleIdPrefix: com.macrilege
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7VNK3YLV96
    CODE_SIGN_STYLE: Automatic
targets:
  LoveRun:
    type: application
    platform: iOS
    sources:
      - path: LoveRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrilege.LoveRun
        PRODUCT_NAME: LoveRun
        PRODUCT_MODULE_NAME: LoveRun
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Love Run
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LoveRunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoveRunTests
    dependencies:
      - target: LoveRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macrilege.LoveRunTests
schemes:
  LoveRun:
    build:
      targets:
        LoveRun: all
        LoveRunTests: [test]
    test:
      targets:
        - LoveRunTests
